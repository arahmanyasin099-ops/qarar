<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#08AEB4"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>قرار | QARAR</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#08AEB4;--ink:#2B2D36;--bg:#F1F4F9;--card:#fff;--mut:#6b7080;--line:#dfe4ec;--red:#d9534f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eef1f6;--bg:#1b1d24;--card:#262932;--mut:#9aa0b2;--line:#363a46}}
html[data-theme="dark"]{--ink:#eef1f6;--bg:#1b1d24;--card:#262932;--mut:#9aa0b2;--line:#363a46}
.ch{display:flex;gap:8px;height:120px;margin-bottom:6px}.ch>div{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.ch .b{display:flex;gap:3px;align-items:flex-end;height:96px;justify-content:center}.ch .b i{width:42%;border-radius:4px 4px 0 0;display:block;min-height:2px}
.set{display:grid;gap:8px}
.md{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:grid;place-items:center;padding:20px}
.md .card{max-width:360px;width:100%;text-align:center;margin:0;padding:20px}
.stars{display:flex;gap:6px;justify-content:center;direction:ltr;margin:12px 0}
.stars button{background:none;border:0;font-size:40px;color:var(--line);cursor:pointer;padding:0;line-height:1}
.stars button.on{color:#f5b301}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;max-width:520px;margin-inline:auto;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:10px;padding:14px 16px}
header img.lg{width:42px;height:42px;border-radius:12px}
header h1{font-size:19px;margin:0;flex:1;font-weight:800}
header h1 small{display:block;font-size:12px;color:var(--mut);font-weight:400}
.av{width:42px;height:42px;border-radius:50%;background:var(--teal);display:grid;place-items:center;font-size:22px;overflow:hidden;border:0;padding:0;cursor:pointer}
.av img{width:100%;height:100%;object-fit:cover}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
nav button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 14px;cursor:pointer;font-size:14px}
nav button.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
main{padding:6px 16px 40px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.hero{background:var(--ink);color:#fff;border-radius:20px;padding:20px;margin-bottom:12px}
:root:not([data-theme="light"]) .hero{background:var(--teal)}
.hero p{margin:0;opacity:.8;font-size:14px}
.hero b{font-size:34px;display:block;margin:4px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid .card{margin:0;text-align:center;cursor:pointer}
.grid b{display:block;font-size:24px;color:var(--teal)}
h2{font-size:17px;margin:4px 0 10px}
form{display:grid;gap:8px;margin-bottom:14px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.btn{background:var(--teal);color:#fff;border:0;border-radius:12px;padding:11px;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--mut);border:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.item{display:flex;gap:10px;align-items:flex-start}
.item>div{flex:1;min-width:0}
.item small{color:var(--mut);display:block}
.x{flex:none!important;background:none;border:0;color:var(--mut);cursor:pointer;font-size:18px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--teal)}
.in{color:var(--teal)}.out{color:var(--red)}
.empty{text-align:center;color:var(--mut);padding:18px 8px}
.done b{text-decoration:line-through;opacity:.55}
.ov{position:fixed;inset:0;background:var(--bg);z-index:9;overflow:auto;padding:24px 20px}
.ov .box{max-width:420px;margin:0 auto;text-align:center}
.ov img.big{width:120px;border-radius:26px;margin:10px 0}
.avs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.avs .av{width:48px;height:48px;opacity:.55}.avs .av.sel{opacity:1;outline:3px solid var(--ink)}
.maker{text-align:center}
.maker p{margin:4px 0;color:var(--mut)}
</style>
</head>

let rate={open:false,v:0,c:"",sent:false};
function rateModal(){
 const v=rate.v;
 return `<div class="md"><div class="card"><h2>${rate.sent?"شكرًا لتقييمك!":"ما رأيك في تطبيق قرار؟"}</h2>
 <p style="color:var(--mut);margin:0">${rate.sent?"رأيك يساعدنا على تطوير التطبيق.":"اضغط على النجوم لتقييم تجربتك"}</p>
 <div class="stars">${[1,2,3,4,5].map(i=>`<button class="${i<=v?"on":""}" data-act="star" data-v="${i}" aria-label="${i} من 5">★</button>`).join("")}</div>
 ${v&&!rate.sent?`<textarea id="rc" rows="2" placeholder="اكتب ملاحظة (اختياري)">${esc(rate.c)}</textarea><div class="set" style="margin-top:8px"><button class="btn" data-act="rsend">إرسال التقييم</button></div>`:""}
 ${rate.sent?`<div class="set"><button class="btn" data-act="wa">إرسال تقييمك عبر واتساب</button></div>`:""}
 <button class="btn alt" style="width:100%;margin-top:8px" data-act="rclose">${rate.sent?"إغلاق":"ليس الآن"}</button></div></div>`;
}
const hs=x=>{let h=5381;for(const c of String(x))h=(h*33+c.charCodeAt(0))>>>0;return String(h)};
let locked=!!S.pin;
const today=()=>new Date().toISOString().slice(0,10);
const QUOTES=["ابدأ من حيث أنت، بما لديك، وتقدّم خطوة اليوم.","المال وسيلة، والهدف حياة مستقرة وكريمة.","فكرة مكتوبة أقوى من مئة فكرة منسية.","الادخار القليل المستمر يتفوق على الكثير المتقطع.","قراراتك الصغيرة اليوم ترسم مستقبلك غدًا.","ما لا تقيسه لا تستطيع تحسينه، فتابع أرقامك.","الاستمرار أهم من الحماس، فاستمر."];
function quote(){return `<div class="card"><b>${QUOTES[new Date().getDate()%7]}</b></div>`}
function noteCard(){const n=S.notes||{},p=Object.keys(n).filter(k=>k!=today()).sort().reverse().slice(0,2);
 return `<div class="card"><h2>مذكرة اليوم</h2><form data-form="note" style="margin:0"><input name="t" value="${esc(n[today()])}" placeholder="سطر عن يومك وقرارك اليوم"><button class="btn">حفظ</button></form>${p.map(k=>`<small style="color:var(--mut);display:block;margin-top:6px">${k}: ${esc(n[k])}</small>`).join("")}</div>`}
function badges(){const L=[[S.ideas.length>0,"أول فكرة"],[S.projects.some(p=>p.pr>=100),"مشروع مكتمل"],[S.goals.some(g=>g.cur>=g.tar),"هدف محقق"],[sum("ادخار")>=10000,"ادخار ١٠٬٠٠٠"],[S.plan.filter(p=>p.done).length>=3,"٣ خطوات منجزة"]];
 return `<div class="card"><h2>إنجازاتك</h2>${L.map(x=>`<span style="display:inline-block;margin:3px;padding:6px 12px;border-radius:20px;font-size:14px;${x[0]?"background:var(--teal);color:#fff":"background:var(--line);color:var(--mut)"}">${x[0]?"★ ":""}${x[1]}</span>`).join("")}</div>`}
function pie(){const c={};S.txs.filter(t=>t.type=="مصروف").forEach(t=>{const k=t.cat||"أخرى";c[k]=(c[k]||0)+t.amt});
 const e=Object.entries(c).sort((a,b)=>b[1]-a[1]),T=e.reduce((a,x)=>a+x[1],0);if(!T)return"";
 const col=["#08AEB4","#2B7A9E","#f5b301","#d9534f","#8e6bbf","#7f8c8d"];let a=0;
 const g=e.map((x,i)=>{const st=a;a+=x[1]/T*100;return col[i%6]+" "+st+"% "+a+"%"}).join(",");
 return `<div class="card"><h2>أين تذهب مصروفاتك</h2><div class="row"><div style="flex:none;width:110px;height:110px;border-radius:50%;background:conic-gradient(${g})"></div><div>${e.map((x,i)=>`<div style="font-size:14px"><span style="color:${col[i%6]}">●</span> ${x[0]} ${num(Math.round(x[1]/T*100))}٪</div>`).join("")}</div></div></div>`}
function lockView(){return `<div class="ov"><div class="box"><img class="big" src="${LOGO}" alt="قرار"><h2>التطبيق مقفل</h2><form data-form="unlock"><input name="pin" type="password" inputmode="numeric" placeholder="الرقم السري" required autofocus><button class="btn">فتح</button></form></div></div>`}
function applyRec(){const n=new Date(),k=n.getFullYear()*12+n.getMonth(),add=[];
 S.txs.filter(t=>t.rec).forEach(t=>{const d0=new Date(t.d||Date.now());if(t.last==null)t.last=d0.getFullYear()*12+d0.getMonth();let g=0;
  while(t.last<k&&g++<24){t.last++;add.push({id:id(),type:t.type,amt:t.amt,n:t.n,cat:t.cat,gen:true,d:new Date(Math.floor(t.last/12),t.last%12,Math.min(d0.getDate(),28)).getTime()})}});
 if(add.length){S.txs=add.concat(S.txs);save()}}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=n=>Number(n||0).toLocaleString("ar-EG");
const id=()=>Date.now()+Math.random();
const sum=t=>S.txs.filter(x=>x.type==t).reduce((a,x)=>a+x.amt,0);
const avatar=(u,cls="")=>`<button class="av ${cls}" data-act="profile" aria-label="الملف الشخصي">${u.photo?`<img src="${u.photo}" alt="">`:AVS[u.av||0]}</button>`;
const empty=t=>`<div class="empty">${t}</div>`;
const del=(k,i)=>`<button class="x" data-act="del" data-k="${k}" data-id="${i}" aria-label="حذف">✕</button>`;

 ${u.photo?`<button class="av sel"><img src="${u.photo}" alt=""></button>`:""}</div>
 <label class="btn alt" style="display:block;cursor:pointer;margin-bottom:10px">إضافة صورتك<input type="file" accept="image/*" id="ph" hidden></label>

function chart(){
 const m=[],n=new Date();
 for(let i=5;i>=0;i--){const x=new Date(n.getFullYear(),n.getMonth()-i,1);m.push({k:x.getFullYear()*12+x.getMonth(),l:x.toLocaleDateString("ar",{month:"short"}),i:0,o:0})}
 S.txs.forEach(t=>{const x=new Date(t.d||Date.now()),r=m.find(q=>q.k==x.getFullYear()*12+x.getMonth());if(r){if(t.type=="دخل")r.i+=t.amt;if(t.type=="مصروف")r.o+=t.amt}});
 const mx=Math.max(1,...m.map(r=>Math.max(r.i,r.o)));
 return `<div class="card"><h2>الدخل والمصروفات (آخر ٦ أشهر)</h2><div class="ch">${m.map(r=>`<div><div class="b"><i style="height:${r.i/mx*100}%;background:var(--teal)"></i><i style="height:${r.o/mx*100}%;background:var(--red)"></i></div>${r.l}</div>`).join("")}</div><small style="color:var(--mut)">تركوازي: دخل · أحمر: مصروف</small></div>`;
}
function due(){
 const t=new Date().toISOString().slice(0,10),l=S.plan.filter(p=>!p.done&&p.d&&p.d<=t);
 return l.length?`<div class="card" style="border-color:var(--teal)"><h2>تذكير</h2>${l.map(p=>`<div class="item"><div><b>${esc(p.t)}</b><small>${p.d<t?"متأخرة":"اليوم"} · ${p.d}</small></div></div>`).join("")}</div>`:"";
}

 if(tab=="home"){

 if(tab=="money")return `<div class="grid"><div class="card"><b class="in">${num(sum("دخل"))}</b>الدخل</div><div class="card"><b class="out">${num(sum("مصروف"))}</b>المصروفات</div></div>
  ${chart()}${pie()}<form data-form="money"><div class="row"><select name="type"><option>دخل</option><option>مصروف</option><option>ادخار</option></select><input name="amt" type="number" min="0" step="any" placeholder="المبلغ" required></div><select name="cat"><option>طعام</option><option>مواصلات</option><option>دراسة</option><option>فواتير</option><option>ترفيه</option><option>أخرى</option></select><input name="n" placeholder="الوصف"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="rec" style="width:auto"> تكرار شهري</label><button class="btn">تسجيل العملية</button></form>`+
  (S.txs.map(x=>`<div class="card item"><div><b class="${x.type=="مصروف"?"out":"in"}">${x.type=="مصروف"?"−":"+"}${num(x.amt)}</b> <small style="display:inline">${x.type}${x.type=="مصروف"?" · "+(x.cat||"أخرى"):""} · ${esc(x.n)}${x.rec?" · شهري":""}</small></div>${del("txs",x.id)}</div>`).join("")||empty("لا توجد عمليات بعد."));
 if(tab=="goals")return `<form data-form="goals"><input name="t" placeholder="هدفك" required><input name="tar" type="number" min="1" step="any" placeholder="القيمة المستهدفة" required><button class="btn">إضافة الهدف</button></form><button class="btn alt" style="width:100%;margin-bottom:12px" data-act="emerg">إضافة صندوق طوارئ (مصروف ٣ أشهر)</button>`+
  (S.goals.map(g=>{const p=Math.min(100,Math.round(g.cur/g.tar*100));return `<div class="card"><div class="item"><div><b>${esc(g.t)}</b><small>${num(g.cur)} من ${num(g.tar)} · ${num(p)}٪</small></div>${del("goals",g.id)}</div><div class="bar"><i style="width:${p}%"></i></div>
  <div class="row" style="margin-top:8px"><input type="number" min="0" step="any" placeholder="أضف تقدمًا" data-in="${g.id}"><button class="btn" data-act="gadd" data-id="${g.id}" style="flex:none">إضافة</button></div></div>`}).join("")||empty("لا توجد أهداف بعد."));
 if(tab=="plan")return `<form data-form="plan"><input name="t" placeholder="ما الذي ستفعله؟" required><input name="d" type="date"><button class="btn">إضافة للخطة</button></form>`+
  (S.plan.slice().sort((a,b)=>(a.d||"9")>(b.d||"9")?1:-1).map(p=>`<div class="card item ${p.done?"done":""}"><input type="checkbox" style="width:22px;flex:none" ${p.done?"checked":""} data-act="chk" data-id="${p.id}" aria-label="تم"><div><b>${esc(p.t)}</b><small>${p.d||""}</small></div>${del("plan",p.id)}</div>`).join("")||empty("خطتك فارغة. أضف أول خطوة."));
 if(tab=="debts"){const o=S.debts.filter(x=>!x.paid),a=o.filter(x=>x.dir=="لي").reduce((t,x)=>t+x.amt,0),b=o.filter(x=>x.dir=="علي").reduce((t,x)=>t+x.amt,0);
  return `<div class="grid"><div class="card"><b class="in">${num(a)}</b>مستحق لك</div><div class="card"><b class="out">${num(b)}</b>مستحق عليك</div></div>

  (S.debts.map(x=>`<div class="card item ${x.paid?"done":""}"><input type="checkbox" style="width:22px;flex:none" ${x.paid?"checked":""} data-act="dpaid" data-id="${x.id}" aria-label="تم السداد"><div><b>${esc(x.n)} · ${num(x.amt)}</b><small>${x.dir=="لي"?"مستحق لك":"مستحق عليك"}${x.d?" · "+x.d:""}</small></div>${del("debts",x.id)}</div>`).join("")||empty("لا توجد ديون مسجلة."))}
 if(tab=="about")return `<div class="card maker"><img src="${LOGO}" alt="" style="width:90px;border-radius:20px"><h2>صانع التطبيق</h2><b>عبد الرحمن ياسين عبد الرحمن</b><p>مبرمج</p><p>السكن: الخرطوم – أم درمان</p><p>للتواصل: <a href="tel:0921674852" style="color:var(--teal)" dir="ltr">0921674852</a></p></div>
  <div class="card"><h2>ملفك الشخصي</h2><form data-form="rename"><input name="name" value="${esc(S.user.name)}" required><button class="btn">تغيير الاسم</button></form><button class="btn alt" style="width:100%" data-act="profile">تغيير الصورة</button></div>
  <div class="card"><h2>الإعدادات</h2><div class="set"><button class="btn alt" data-act="theme">المظهر: ${({auto:"تلقائي",dark:"ليلي",light:"فاتح"})[S.theme||"auto"]}</button><button class="btn alt" data-act="notif">تفعيل التنبيهات</button><button class="btn alt" data-act="setpin">${S.pin?"تغيير أو إلغاء الرقم السري":"قفل التطبيق برقم سري"}</button><button class="btn alt" data-act="share">مشاركة التطبيق</button><button class="btn alt" data-act="ropen">قيّم التطبيق${S.rating?" (تقييمك: "+S.rating.v+"/5)":""}</button><button class="btn alt" data-act="export">تصدير نسخة احتياطية</button><label class="btn alt" style="display:block;text-align:center;cursor:pointer">استيراد نسخة احتياطية<input type="file" accept="application/json" id="imp" hidden></label></div></div>`;
}

function render(){
 S.theme=="auto"||!S.theme?document.documentElement.removeAttribute("data-theme"):document.documentElement.dataset.theme=S.theme;
 const app=document.getElementById("app");
 if(S.pin&&locked){app.innerHTML=lockView();return}
 if(!S.user){app.innerHTML=welcome();return}
 app.innerHTML=`<header><img class="lg" src="${LOGO}" alt="قرار"><h1>مرحبًا، ${esc(S.user.name)}<small>${WELCOME[new Date().getDate()%3]}</small></h1>${avatar(S.user)}</header>
 <nav>${TABS.map(t=>`<button class="${tab==t[0]?"on":""}" data-act="tab" data-t="${t[0]}">${t[1]} ${t[2]}</button>`).join("")}</nav><main>${view()}</main>${rate.open?rateModal():""}`;
}

function readPhoto(f){
 const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),s=Math.min(im.width,im.height),z=128;c.width=c.height=z;
  c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,z,z);const d=c.toDataURL("image/jpeg",.8);
  if(S.user){S.user.photo=d;save()}else draft.photo=d;render()};im.src=r.result};
 r.readAsDataURL(f);
}

document.addEventListener("change",e=>{
 const t=e.target;
 if(t.id=="ph"&&t.files[0])readPhoto(t.files[0]);
 if(t.id=="imp"&&t.files[0])t.files[0].text().then(x=>{try{const d=JSON.parse(x);if(d&&d.user){S=Object.assign(S,d);save();render();alert("تم استيراد النسخة")}else alert("ملف غير صالح")}catch(e){alert("ملف غير صالح")}});
 if(t.dataset.act=="dpaid"){S.debts.find(x=>x.id==t.dataset.id).paid=t.checked;save();render()}
 if(t.dataset.act=="chk"){const p=S.plan.find(x=>x.id==t.dataset.id);p.done=t.checked;save();render()}
 if(t.dataset.act=="prog"){S.projects.find(x=>x.id==t.dataset.id).pr=+t.value;save();render()}
});
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b||b.type=="range"||b.type=="checkbox")return;
 const a=b.dataset.act;
 if(a=="tab"){tab=b.dataset.t;render();scrollTo(0,0)}
 if(a=="pickav"){draft.av=+b.dataset.i;draft.photo=null;draft.name=document.querySelector("[name=name]").value;render()}
 if(a=="profile"){const x=document.createElement("input");x.type="file";x.accept="image/*";x.onchange=()=>x.files[0]&&readPhoto(x.files[0]);x.click()}
 if(a=="del"){const k=b.dataset.k;S[k]=S[k].filter(x=>x.id!=b.dataset.id);save();render()}
 if(a=="star"){const c=document.getElementById("rc");if(c)rate.c=c.value;rate.v=+b.dataset.v;render()}
 if(a=="rsend"){const c=document.getElementById("rc");S.rating={v:rate.v,c:(c?c.value:rate.c).trim(),d:Date.now()};S.rated=true;rate.sent=true;save();render()}
 if(a=="wa"){const v=S.rating?S.rating.v:rate.v,m="تقييمي لتطبيق قرار: "+"★".repeat(v)+"☆".repeat(5-v)+" ("+v+"/5)"+(S.rating&&S.rating.c?"\n"+S.rating.c:"");window.open("https://wa.me/249921674852?text="+encodeURIComponent(m),"_blank")}
 if(a=="rclose"){if(!rate.sent){S.later=Date.now();save()}rate.open=false;rate.sent=false;render()}
 if(a=="ropen"){rate={open:true,v:S.rating?S.rating.v:0,c:"",sent:false};render()}
 if(a=="toproj"){const i=S.ideas.find(x=>x.id==b.dataset.id);S.projects.unshift({id:id(),t:i.t,n:i.n,pr:0});S.ideas=S.ideas.filter(x=>x!==i);save();tab="projects";render()}
 if(a=="emerg"){const m=+prompt("كم مصروفك الشهري تقريبًا؟");if(m>0){S.goals.unshift({id:id(),t:"صندوق الطوارئ",tar:m*3,cur:0});save();render()}}
 if(a=="setpin"){const v=prompt("أدخل رقمًا سريًا (٤ أرقام أو أكثر). اتركه فارغًا لإلغاء القفل.");if(v!==null){S.pin=v.trim()?hs(v.trim()):"";locked=false;save();render();alert(S.pin?"تم تفعيل القفل":"تم إلغاء القفل")}}
 if(a=="share"){const u=location.href.split("#")[0],t="جرّب تطبيق قرار لإدارة أفكارك وأموالك وأهدافك";(navigator.share?navigator.share({title:"قرار | QARAR",text:t,url:u}):Promise.reject()).catch(()=>window.open("https://wa.me/?text="+encodeURIComponent(t+" "+u),"_blank"))}
 if(a=="theme"){S.theme={auto:"dark",dark:"light",light:"auto"}[S.theme||"auto"];save();render()}
 if(a=="export"){const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"})),l=document.createElement("a");l.href=u;l.download="qarar-backup.json";l.click()}
 if(a=="notif"){try{Notification.requestPermission().then(p=>{alert(p=="granted"?"تم تفعيل التنبيهات":"لم يتم السماح بالتنبيهات");notify()})}catch(e){alert("المتصفح لا يدعم التنبيهات")}}
 if(a=="gadd"){const v=+document.querySelector(`[data-in="${b.dataset.id}"]`).value;if(v>0){S.goals.find(x=>x.id==b.dataset.id).cur+=v;save();render()}}
});
document.addEventListener("submit",e=>{
 e.preventDefault();const f=e.target,k=f.dataset.form,d=Object.fromEntries(new FormData(f));
 if(k=="unlock"){if(hs(d.pin)==S.pin)locked=false;else alert("الرقم السري غير صحيح");render();return}
 if(k=="note"){S.notes=S.notes||{};S.notes[today()]=d.t}
 if(k=="debts")S.debts.unshift({id:id(),dir:d.dir,amt:+d.amt,n:d.n,d:d.d,paid:false});
 if(k=="start")S.user={name:d.name.trim(),av:draft.av,photo:draft.photo};
 if(k=="rename")S.user.name=d.name.trim();
 if(k=="ideas")S.ideas.unshift({id:id(),t:d.t,n:d.n});
 if(k=="projects")S.projects.unshift({id:id(),t:d.t,n:d.n,pr:0});
 if(k=="money")S.txs.unshift({id:id(),type:d.type,amt:+d.amt,n:d.n,d:Date.now(),cat:d.cat,rec:!!d.rec});
 if(k=="goals")S.goals.unshift({id:id(),t:d.t,tar:+d.tar,cur:0});
 if(k=="plan")S.plan.unshift({id:id(),t:d.t,d:d.d,done:false});
 save();render();
});
function notify(){try{
 if(!S.user||Notification.permission!="granted")return;
 const t=new Date().toISOString().slice(0,10),l=S.plan.filter(p=>!p.done&&p.d&&p.d<=t);
 if(l.length&&localStorage.getItem("qn")!=t){localStorage.setItem("qn",t);navigator.serviceWorker.ready.then(r=>r.showNotification("قرار",{body:"لديك "+l.length+" خطوة تنتظرك اليوم",icon:"icon-192.png"}))}
}catch(e){}}
if(S.user){S.opens=(S.opens||0)+1;applyRec();save()}
render();notify();
if(S.user&&!S.rated&&S.opens>=3&&(!S.later||Date.now()-S.later>2592e5))setTimeout(()=>{const t=document.activeElement&&document.activeElement.tagName;if(t!="INPUT"&&t!="TEXTAREA"){rate.open=true;render()}},4000);
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
